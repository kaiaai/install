name: Docker image

# Build the kaiaai/kaiaai image and push it to Docker Hub on push to jazzy.
# Replaces the manual docker/utils/build_jazzy*.cmd + attest_jazzy*.cmd flow.
on:
  push:
    branches: [jazzy]
  workflow_dispatch:

jobs:
  docker-image:
    name: Build & push kaiaai/kaiaai (jazzy + jazzy-dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Check Docker Hub credentials
        id: creds
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set -- skipping image build & push. See docker/kaiaai/README.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free up disk (the image is large)
        if: steps.creds.outputs.ok == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Set up Buildx
        if: steps.creds.outputs.ok == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.creds.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/kaiaai
          push: true
          # the image git-clones the LATEST upstream kaiaai repos at build time;
          # layer caching would pin stale clones, so build clean for "latest".
          no-cache: true
          provenance: true          # matches docker/utils/attest_jazzy.cmd
          # one Dockerfile, published under both tags (see build_jazzy*.cmd)
          tags: |
            kaiaai/kaiaai:jazzy
            kaiaai/kaiaai:jazzy-dev
